name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/micanchor-${{ github.sha }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/micanchor.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: micanchor-apk
          path: dist/micanchor-${{ github.sha }}.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/micanchor.apk
          generate_release_notes: true
          body: |
            Sideload with:

            ```bash
            adb install -r micanchor.apk
            adb shell pm grant com.micanchor android.permission.RECORD_AUDIO
            adb shell am start-foreground-service -n com.micanchor/.MicAnchorService
            ```

            This APK was built by GitHub Actions directly from the tagged commit —
            see the Actions tab for the full build log.

            **Note:** debug-signed. Uninstall any previous version before installing a
            new release, as signatures will not match across builds.
